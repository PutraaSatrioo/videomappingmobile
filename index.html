<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>XR Budaya Indonesia - Catch Scanner</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.20.1/dist/ort.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        
        html,
        body {
            background: #000;
            color: #fff;
            overflow: hidden;
            height: 100vh;
            height: 100dvh;
            width: 100vw;
            user-select: none;
            overscroll-behavior: none;
        }
        
        #camera-feed {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
        }
        
        #detection-labels { position: fixed; inset: 0; z-index: 3; pointer-events: none; }
        .detection-label { position: absolute; padding: 5px 8px; border-radius: 6px; background: rgba(15,23,42,.88); color: white; font-size: 14px; font-weight: 700; border: 1px solid #38bdf8; transform: translate(-50%, -100%); white-space: nowrap; }
        .vignette {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at center, transparent 45%, rgba(0, 0, 0, 0.45) 100%);
            z-index: 2;
            pointer-events: none;
        }
        
        #capture-flash {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.78) 0%, rgba(255, 255, 255, 0) 70%);
            z-index: 7;
            opacity: 0;
            pointer-events: none;
        }
        
        .flash-active {
            animation: flashAnim 0.9s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }
        
        @keyframes flashAnim {
            0% {
                opacity: 0.85;
            }
            100% {
                opacity: 0;
            }
        }
        /* Lingkaran Putih Bercahaya (Energi Hewan Tertangkap) */
        
        #captured-orb {
            position: fixed;
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: radial-gradient(circle, #ffffff 32%, rgba(255, 255, 255, 0.88) 60%, rgba(255, 255, 255, 0) 76%);
            box-shadow: 0 0 26px 12px rgba(255, 255, 255, 0.95), 0 0 60px 24px rgba(255, 255, 255, 0.72), 0 0 95px 38px rgba(196, 181, 253, 0.55);
            transform: translate(-50%, -50%) scale(0);
            opacity: 0;
            pointer-events: none;
            z-index: 9;
        }
        
        .ui-layer {
            position: fixed;
            inset: 0;
            z-index: 4;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 22px 22px 28px 22px;
            pointer-events: none;
        }
        /* Bar Atas Minimalis */
        
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: auto;
        }
        
        .icon-btn-top {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.15s, background 0.2s;
        }
        
        .icon-btn-top:active {
            transform: scale(0.92);
            background: rgba(255, 255, 255, 0.25);
        }
        
        .status-pill-top {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.6px;
            color: rgba(255, 255, 255, 0.85);
            background: rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            padding: 6px 14px;
            border-radius: 999px;
            border: 1px solid rgba(255, 255, 255, 0.18);
            transition: all 0.25s ease;
        }
        /* Area Tengah: Busur & Anak Panah Interaktif */
        
        .bow-stage {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            pointer-events: auto;
            touch-action: none;
            cursor: grab;
            padding: 16px;
        }
        
        .bow-stage:active {
            cursor: grabbing;
        }
        
        .bow-wrapper {
            position: relative;
            width: 260px;
            height: 270px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        #bow-svg {
            width: 240px;
            height: 260px;
            overflow: visible;
            filter: drop-shadow(0 0 6px rgba(255, 255, 255, 0.9)) drop-shadow(0 0 16px rgba(255, 255, 255, 0.55));
            transition: filter 0.45s cubic-bezier(0.22, 1, 0.36, 1), transform 0.45s cubic-bezier(0.22, 1, 0.36, 1);
            animation: floatBow 3.2s ease-in-out infinite;
        }
        
        .bow-stage.pulling #bow-svg,
        .bow-stage.firing #bow-svg {
            animation: none;
        }
        
        @keyframes floatBow {
            0%,
            100% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-5px);
            }
        }
        /* Saat objek terdeteksi di kamera */
        
        .bow-stage.detected #bow-svg {
            filter: drop-shadow(0 0 8px #ffffff) drop-shadow(0 0 22px rgba(255, 255, 255, 0.95)) drop-shadow(0 0 36px rgba(139, 92, 246, 0.8));
        }
        /* Saat tarikan sudah mencapai batas siap tembak */
        
        .bow-stage.ready-to-fire #bow-svg {
            filter: drop-shadow(0 0 12px #ffffff) drop-shadow(0 0 28px #ffffff) drop-shadow(0 0 46px rgba(167, 139, 250, 0.95));
        }
        /* Efek busur bersinar lembut sesaat saat dilepas */
        
        .bow-stage.firing #bow-svg {
            animation: bowGlowSurge 1.05s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }
        
        @keyframes bowGlowSurge {
            0% {
                filter: drop-shadow(0 0 14px #ffffff) drop-shadow(0 0 32px #ffffff) drop-shadow(0 0 54px rgba(139, 92, 246, 0.95));
                transform: scale(1.02);
            }
            30% {
                filter: drop-shadow(0 0 20px #ffffff) drop-shadow(0 0 48px #ffffff) drop-shadow(0 0 80px rgba(255, 255, 255, 1));
                transform: scale(1.06);
            }
            100% {
                filter: drop-shadow(0 0 6px rgba(255, 255, 255, 0.85)) drop-shadow(0 0 16px rgba(255, 255, 255, 0.45));
                transform: scale(1);
            }
        }
        /* Transisi muncul kembali anak panah secara mulus setelah bola cahaya masuk */
        
        #arrow-group {
            opacity: 1;
            transition: opacity 0.75s cubic-bezier(0.22, 1, 0.36, 1);
        }
        /* Menahan opacity 0 selama bola cahaya meluncur perlahan menuju bawah */
        
        .bow-stage.arrow-hidden #arrow-group {
            opacity: 0 !important;
            transition: none !important;
            pointer-events: none;
        }
        /* Animasi anak panah berubah terang bercahaya dan menghilang perlahan saat dilepas */
        
        .bow-stage.firing #arrow-group {
            animation: arrowBrightFade 0.95s cubic-bezier(0.22, 1, 0.36, 1) forwards !important;
        }
        
        @keyframes arrowBrightFade {
            0% {
                transform: translateY(var(--release-y, 40px)) scale(1);
                opacity: 1;
                filter: drop-shadow(0 0 8px #ffffff) drop-shadow(0 0 18px #ffffff);
            }
            35% {
                transform: translateY(-18px) scale(1.05);
                opacity: 0.95;
                filter: drop-shadow(0 0 22px #ffffff) drop-shadow(0 0 48px #ffffff) drop-shadow(0 0 75px #ffffff);
            }
            70% {
                transform: translateY(-65px) scale(1.02);
                opacity: 0.45;
                filter: drop-shadow(0 0 26px #ffffff) drop-shadow(0 0 56px #ffffff);
            }
            100% {
                transform: translateY(-95px) scale(0.96);
                opacity: 0;
                filter: drop-shadow(0 0 30px #ffffff);
            }
        }
        /* Partikel kilau di sepanjang anak panah saat dilepas */
        
        .arrow-sparkle {
            fill: #ffffff;
            opacity: 0;
            transform-box: fill-box;
            transform-origin: center;
        }
        
        .bow-stage.firing .arrow-sparkle {
            animation: arrowGlitter 0.95s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }
        
        .bow-stage.firing .arrow-sparkle:nth-child(2) {
            animation-delay: 0.06s;
        }
        
        .bow-stage.firing .arrow-sparkle:nth-child(3) {
            animation-delay: 0.12s;
        }
        
        .bow-stage.firing .arrow-sparkle:nth-child(4) {
            animation-delay: 0.18s;
        }
        
        .bow-stage.firing .arrow-sparkle:nth-child(5) {
            animation-delay: 0.24s;
        }
        
        .bow-stage.firing .arrow-sparkle:nth-child(6) {
            animation-delay: 0.3s;
        }
        
        @keyframes arrowGlitter {
            0% {
                opacity: 0;
                transform: scale(0.3) translate(0, 0);
            }
            35% {
                opacity: 1;
                transform: scale(1.8) translate(var(--dx, 0px), var(--dy, 0px));
            }
            70% {
                opacity: 0.8;
                transform: scale(0.9) translate(calc(var(--dx, 0px) * 1.6), calc(var(--dy, 0px) * 1.6));
            }
            100% {
                opacity: 0;
                transform: scale(0.1) translate(calc(var(--dx, 0px) * 2.2), calc(var(--dy, 0px) * 2.2));
            }
        }
        /* Indikator arah tarik ke bawah */
        
        .pull-indicator {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            margin-top: -12px;
            opacity: 0;
            transition: opacity 0.3s ease, transform 0.3s ease;
            pointer-events: none;
        }
        
        .bow-stage.detected .pull-indicator {
            opacity: 0.9;
            animation: pullBounce 1.4s infinite ease-in-out;
        }
        
        .bow-stage.pulling .pull-indicator,
        .bow-stage.firing .pull-indicator,
        .bow-stage.arrow-hidden .pull-indicator {
            opacity: 0 !important;
        }
        
        @keyframes pullBounce {
            0%,
            100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(7px);
            }
        }
        /* Animasi kelap-kelip partikel bintang di sekitar busur */
        
        .sparkle {
            fill: #ffffff;
            animation: twinkle 2.2s infinite ease-in-out;
        }
        
        .sparkle:nth-child(2) {
            animation-delay: 0.4s;
        }
        
        .sparkle:nth-child(3) {
            animation-delay: 0.9s;
        }
        
        .sparkle:nth-child(4) {
            animation-delay: 1.3s;
        }
        
        .sparkle:nth-child(5) {
            animation-delay: 1.7s;
        }
        
        @keyframes twinkle {
            0%,
            100% {
                opacity: 0.25;
                transform: scale(0.8);
            }
            50% {
                opacity: 1;
                transform: scale(1.25);
            }
        }
        
        .subtle-guide {
            margin-top: 8px;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.4px;
            color: rgba(255, 255, 255, 0.9);
            text-shadow: 0 1px 6px rgba(0, 0, 0, 0.85);
            transition: color 0.25s ease, opacity 0.25s ease;
            text-align: center;
        }
        
        .subtle-guide.fire-ready {
            color: #a78bfa;
        }
        /* Bilah Bawah */
        
        .bottom-bar {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            pointer-events: auto;
            padding: 0 6px;
        }
        
        .side-action {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            background: none;
            border: none;
            color: #fff;
            cursor: pointer;
            min-width: 52px;
            transition: transform 0.15s;
        }
        
        .side-action:active {
            transform: scale(0.9);
        }
        
        .side-action.bump {
            animation: bumpScale 0.55s ease;
        }
        
        @keyframes bumpScale {
            0% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.25);
            }
            100% {
                transform: scale(1);
            }
        }
        
        .side-icon-box {
            width: 34px;
            height: 34px;
            display: flex;
            align-items: center;
            justify-content: center;
            filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.6));
        }
        
        .side-label {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.3px;
            color: rgba(255, 255, 255, 0.92);
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.8);
        }
        /* Kapsul Tengah (Frosted Glass Pill) */
        
        .center-pill {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.22);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.32);
            border-radius: 999px;
            padding: 5px;
            gap: 4px;
            box-shadow: 0 8px 28px rgba(0, 0, 0, 0.35);
            transition: all 0.35s cubic-bezier(0.22, 1, 0.36, 1);
        }
        
        .pill-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 72px;
            height: 58px;
            border-radius: 999px;
            border: none;
            background: transparent;
            color: rgba(255, 255, 255, 0.65);
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.3px;
            gap: 3px;
            transition: all 0.35s cubic-bezier(0.22, 1, 0.36, 1);
        }
        
        .pill-item.active-ready {
            background: rgba(255, 255, 255, 0.92);
            color: #111827;
            box-shadow: 0 2px 12px rgba(255, 255, 255, 0.5);
        }
        
        .pill-item.active-caught {
            background: rgba(255, 255, 255, 0.95);
            color: #2e1065;
            box-shadow: 0 0 18px rgba(139, 92, 246, 0.75);
        }
        
        .center-pill.absorb-glow {
            animation: pillAbsorb 0.8s cubic-bezier(0.22, 1, 0.36, 1);
        }
        
        @keyframes pillAbsorb {
            0% {
                transform: scale(1);
            }
            45% {
                transform: scale(1.14);
                background: rgba(255, 255, 255, 0.95);
                box-shadow: 0 0 40px 14px rgba(255, 255, 255, 0.95);
            }
            100% {
                transform: scale(1);
            }
        }
        /* Tooltip Hint */
        
        #hint-toast {
            position: fixed;
            bottom: 108px;
            left: 50%;
            transform: translateX(-50%) translateY(10px);
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            color: #f8fafc;
            padding: 10px 16px;
            border-radius: 14px;
            font-size: 12px;
            text-align: center;
            width: 84%;
            max-width: 330px;
            opacity: 0;
            pointer-events: none;
            transition: all 0.25s ease;
            z-index: 8;
        }
        
        #hint-toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
        /* Modal Umum */
        
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(9, 13, 22, 0.92);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            z-index: 12;
            display: none;
            flex-direction: column;
            padding: 24px;
            overflow-y: auto;
        }
        
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
            padding-bottom: 12px;
        }
        
        .btn-close-modal {
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
            border: none;
            padding: 7px 14px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
        }
        
        .card-item {
            background: rgba(30, 41, 59, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.35);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 12px;
        }
        
        .card-item h3 {
            color: #ffffff;
            margin-bottom: 4px;
            font-size: 16px;
        }
        
        .card-item p {
            font-size: 13px;
            color: #cbd5e1;
        }
        
        .form-group {
            margin-bottom: 16px;
        }
        
        .form-group label {
            display: block;
            font-size: 13px;
            color: #cbd5e1;
            margin-bottom: 6px;
            font-weight: 600;
        }
        
        .form-group input {
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            border: 1px solid #475569;
            background: #1e293b;
            color: #fff;
            font-size: 14px;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: #ffffff;
        }
        
        .btn-save {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: none;
            background: #ffffff;
            color: #0f172a;
            font-weight: 800;
            font-size: 15px;
            cursor: pointer;
            margin-top: 8px;
        }
    </style>
</head>

<body>

    <video id="camera-feed" autoplay playsinline></video>
    <div id="detection-labels"></div>
    <div class="vignette"></div>
    <canvas id="vision-canvas" width="320" height="320" style="display:none;"></canvas>
    <div id="capture-flash"></div>

    <!-- Bola cahaya putih yang terbang perlahan masuk ke bilah bawah -->
    <div id="captured-orb"></div>

    <!-- Pesan Hint Singkat -->
    <div id="hint-toast">Arahkan busur panah ke harimau galaxy, lalu sentuh dan tarik anak panah ke bawah dan lepaskan!</div>

    <div class="ui-layer">
        <!-- Bar Atas -->
        <div class="top-bar">
            <!-- Kiri: Pengaturan Supabase -->
            <button class="icon-btn-top" onclick="toggleSettings(true)" title="Kredensial Supabase">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
          <polyline points="16 17 21 12 16 7"/>
          <line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
      </button>

            <!-- Tengah: Status Wilayah -->
            <div class="status-pill-top" id="status-badge">Menghubungkan...</div>

            <!-- Kanan: Tombol Full Screen -->
            <button class="icon-btn-top" id="btn-fullscreen" onclick="toggleFullScreen()" title="Layar Penuh">
        <svg id="icon-fs-enter" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 3 21 3 21 9"/>
          <polyline points="9 21 3 21 3 15"/>
          <line x1="21" y1="3" x2="14" y2="10"/>
          <line x1="3" y1="21" x2="10" y2="14"/>
        </svg>
        <svg id="icon-fs-exit" style="display:none;" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="4 14 10 14 10 20"/>
          <polyline points="20 10 14 10 14 4"/>
          <line x1="14" y1="10" x2="21" y2="3"/>
          <line x1="3" y1="21" x2="10" y2="14"/>
        </svg>
      </button>
        </div>

        <!-- Tengah: Ilustrasi Busur & Anak Panah Bercahaya -->
        <div class="bow-stage" id="bow-stage">
            <div class="bow-wrapper">
                <svg id="bow-svg" viewBox="0 0 240 240" fill="none" xmlns="http://www.w3.org/2000/svg">
          <!-- Partikel Kilau Cahaya di Sekitar Busur -->
          <circle class="sparkle" cx="62" cy="82" r="2.2" />
          <circle class="sparkle" cx="76" cy="68" r="1.6" />
          <circle class="sparkle" cx="54" cy="102" r="1.5" />
          <circle class="sparkle" cx="174" cy="96" r="2.0" />
          <circle class="sparkle" cx="164" cy="148" r="1.8" />
          <circle class="sparkle" cx="82" cy="154" r="1.7" />

          <!-- Lengkung Busur Bercahaya -->
          <path id="bow-limb-outer" d="M 32 146 C 68 104, 172 104, 208 146" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round"/>
          <path id="bow-limb-inner" d="M 36 144 C 72 108, 168 108, 204 144" stroke="#FFFFFF" stroke-width="1.3" stroke-opacity="0.7" stroke-linecap="round"/>

          <!-- Ujung Kait Busur Kiri & Kanan -->
          <path id="bow-tip-left" d="M 32 146 C 24 146, 23 153, 30 153 C 35 153, 38 149, 41 148" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
          <path id="bow-tip-right" d="M 208 146 C 216 146, 217 153, 210 153 C 205 153, 202 149, 199 148" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>

          <!-- Tali Busur -->
          <path id="bow-string" d="M 32 147 Q 120 147 208 147" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.9" stroke-linecap="round"/>

          <!-- Grup Anak Panah + Partikel Kilau Saat Dilepas -->
          <g id="arrow-group">
            <!-- Kilau Bintang di Sepanjang Anak Panah -->
            <circle class="arrow-sparkle" cx="120" cy="42" r="3.4" style="--dx: 0px; --dy: -16px;" />
            <circle class="arrow-sparkle" cx="105" cy="68" r="2.6" style="--dx: -16px; --dy: -8px;" />
            <circle class="arrow-sparkle" cx="135" cy="72" r="2.6" style="--dx: 16px; --dy: -6px;" />
            <circle class="arrow-sparkle" cx="110" cy="108" r="2.4" style="--dx: -14px; --dy: 6px;" />
            <circle class="arrow-sparkle" cx="130" cy="116" r="2.8" style="--dx: 15px; --dy: 8px;" />
            <circle class="arrow-sparkle" cx="120" cy="145" r="3.0" style="--dx: -6px; --dy: 14px;" />

            <!-- Batang Anak Panah -->
            <line x1="120" y1="46" x2="120" y2="178" stroke="#FFFFFF" stroke-width="3.4" stroke-linecap="round"/>

            <!-- Ujung Mata Panah Runcing -->

    <script>
        const DEFAULT_URL = 'https://lkyunvagzbodtmvbdfdm.supabase.co';
        const DEFAULT_KEY = 'sb_publishable_CRMI4bAg4seaGDWpY-CfEw_pqKDzO1z';
        const DEFAULT_TARGET = 'harimau_sumatra';
        const DEFAULT_HINT_MSG = 'Arahkan busur panah ke harimau galaxy, lalu sentuh dan tarik anak panah ke bawah dan lepaskan!';
        const DETECTION_MODEL_URL = './track/badak_harimau.onnx';
        const MODEL_INPUT_SIZE = 320;
        const DETECTION_CONFIDENCE = 0.45;
        const TARGET_CENTER_TOLERANCE = 0.20; // Hanya hewan di area tengah layar (reticle busur)

        let currentCenterAnimal = null; // Menyimpan hewan yang berada pas di tengah layar

        // Deteksi warna HSV untuk harimau galaxy (ungu/biru/magenta)
        // Jika model ONNX tidak tersedia, fallback ke deteksi warna.
        const COLOR_DETECT_SIZE = 160; // resolusi analisis warna
        const COLOR_MIN_RATIO = 0.03;  // minimal 3% piksel berwarna galaxy
        const COLOR_CENTER_WEIGHT = 0.6; // area tengah harus punya konsentrasi warna

        let db = null;
        let myCollection = [];
        let currentTargetId = localStorage.getItem('xr_target_id') || DEFAULT_TARGET;
        let currentFauna = null;
        let isObjectDetected = false;
        let isCatchingNow = false;
        let isFiringAnim = false;
        let hintTimeout = null;
        let detectorSession = null;
        let isAnalyzingFrame = false;
        let modelLoadFailed = false;
        let useColorFallback = false;
        let consecutiveNoDetect = 0;
        let consecutiveColorDetect = 0;

        // Variabel interaksi tarik panah ke bawah
        let isPulling = false;
        let pullStartY = 0;
        let currentPull = 0;
        let hasTriggeredReadyHaptic = false;
        let recoilFrameId = null;
        const FIRE_THRESHOLD = 52;
        const MAX_PULL = 88;

        const videoEl = document.getElementById('camera-feed');
        const canvasEl = document.getElementById('vision-canvas');
        const ctx = canvasEl.getContext('2d', {
            willReadFrequently: true
        });

        const bowStage = document.getElementById('bow-stage');
        const arrowGroup = document.getElementById('arrow-group');
        const bowString = document.getElementById('bow-string');
        const bowLimbOuter = document.getElementById('bow-limb-outer');
        const bowLimbInner = document.getElementById('bow-limb-inner');
        const bowTipLeft = document.getElementById('bow-tip-left');
        const bowTipRight = document.getElementById('bow-tip-right');

        // Menggambar kelenturan busur & tali
        function renderBowTension(pullPx, moveArrow = true) {
            const ratio = Math.min(1, pullPx / MAX_PULL);
            const tipShiftX = ratio * 7;
            const tipShiftY = ratio * 9;

            const leftX = 32 + tipShiftX;
            const rightX = 208 - tipShiftX;
            const tipY = 146 + tipShiftY;

            bowLimbOuter.setAttribute('d', `M ${leftX} ${tipY} C 68 ${104 + ratio * 12}, 172 ${104 + ratio * 12}, ${rightX} ${tipY}`);
            bowLimbInner.setAttribute('d', `M ${leftX + 4} ${tipY - 2} C 72 ${108 + ratio * 12}, 168 ${108 + ratio * 12}, ${rightX - 4} ${tipY - 2}`);
            bowTipLeft.setAttribute('transform', `translate(${tipShiftX}, ${tipShiftY})`);
            bowTipRight.setAttribute('transform', `translate(${-tipShiftX}, ${tipShiftY})`);

            const stringPullY = 147 + pullPx * 1.45;
            bowString.setAttribute('d', `M ${leftX} ${tipY + 1} Q 120 ${stringPullY} ${rightX} ${tipY + 1}`);

            if (moveArrow) {
                arrowGroup.style.transform = `translateY(${pullPx}px)`;
            }
        }

        // Mengembalikan kelenturan tali busur secara mulus
        function animateStringRecoil(fromPull, moveArrow = true, durationMs = 260) {
            if (recoilFrameId) cancelAnimationFrame(recoilFrameId);
            const startTime = performance.now();

            function step(now) {
                const elapsed = now - startTime;
                const t = Math.min(1, elapsed / durationMs);
                const easeOut = 1 - Math.pow(1 - t, 3);
                const val = fromPull * (1 - easeOut);

                renderBowTension(val, moveArrow);

                if (t < 1) {
                    recoilFrameId = requestAnimationFrame(step);
                } else {
                    renderBowTension(0, moveArrow);
                    recoilFrameId = null;
                }
            }

            recoilFrameId = requestAnimationFrame(step);
        }

        function resetBowTension(smooth = true) {
            const startVal = currentPull;
            currentPull = 0;
            hasTriggeredReadyHaptic = false;
            bowStage.classList.remove('pulling', 'ready-to-fire');

            if (smooth && startVal > 0) {
                animateStringRecoil(startVal, true, 280);
            } else {
                if (recoilFrameId) cancelAnimationFrame(recoilFrameId);
                renderBowTension(0, true);
            }
        }

        // Event Listener Tarik Panah ke Bawah
        bowStage.addEventListener('pointerdown', (e) => {
            if (isFiringAnim) return;

            if (recoilFrameId) cancelAnimationFrame(recoilFrameId);
            isPulling = true;
            pullStartY = e.clientY;
            currentPull = 0;
            hasTriggeredReadyHaptic = false;

            bowStage.setPointerCapture(e.pointerId);
            bowStage.classList.add('pulling');
        });

        bowStage.addEventListener('pointermove', (e) => {
            if (!isPulling) return;

            const deltaY = Math.max(0, e.clientY - pullStartY);

            if (!isObjectDetected) {
                currentPull = Math.min(18, deltaY * 0.25);
                renderBowTension(currentPull, true);
                return;
            }

            currentPull = Math.min(MAX_PULL, deltaY);
            renderBowTension(currentPull, true);

            const targetText = document.getElementById('target-text');
            const targetName = currentFauna ? currentFauna.name : 'Target';

            if (currentPull >= FIRE_THRESHOLD) {
                bowStage.classList.add('ready-to-fire');
                targetText.innerText = 'Lepaskan untuk menembak!';
                targetText.classList.add('fire-ready');

                if (!hasTriggeredReadyHaptic) {
                    hasTriggeredReadyHaptic = true;
                    if (navigator.vibrate) navigator.vibrate(30);
                }
            } else {
                bowStage.classList.remove('ready-to-fire');
                targetText.innerText = `Tarik terus ke bawah (${targetName})`;
                targetText.classList.remove('fire-ready');
            }
        });

        function handlePointerRelease(e) {
            if (!isPulling) return;
            isPulling = false;
            if (bowStage.hasPointerCapture(e.pointerId)) {
                bowStage.releasePointerCapture(e.pointerId);
            }

            const pulledDistance = currentPull;
            bowStage.classList.remove('pulling', 'ready-to-fire');

            if (!isObjectDetected) {
                resetBowTension(true);
                showHint();
                return;
            }

            if (pulledDistance >= FIRE_THRESHOLD) {
                currentPull = 0;
                arrowGroup.style.setProperty('--release-y', `${pulledDistance}px`);
                animateStringRecoil(pulledDistance, false, 240);
                playBowReleaseAndOrbAnimation();
                catchFauna();
            } else {
                resetBowTension(true);
                refreshActionState();
            }
        }

        bowStage.addEventListener('pointerup', handlePointerRelease);
        bowStage.addEventListener('pointercancel', handlePointerRelease);

        async function startCamera() {
            try {
                try {
                    await loadDetectorModel();
                } catch (modelError) {
                    modelLoadFailed = true;
                    useColorFallback = true;
                    console.warn('Model ONNX gagal dimuat, menggunakan deteksi warna sebagai fallback.', modelError.message);
                }
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        facingMode: 'environment'
                    },
                    audio: false
                });
                videoEl.srcObject = stream;
                videoEl.onloadedmetadata = () => {
                    if (useColorFallback) {
                        setInterval(analyzeColorFrame, 200);
                        console.info('Deteksi warna aktif (fallback, setiap 200ms).');
                    } else {
                        setInterval(analyzeCameraFrame, 180);
                        console.info('Deteksi ONNX aktif setiap 180ms.');
                    }
                };
            } catch (err) {
                console.error('Gagal membuka kamera:', err);
                alert('Gagal membuka kamera. Pastikan halaman dibuka melalui HTTPS.');
            }
        }

        async function loadDetectorModel() {
            if (!window.ort) throw new Error('ONNX Runtime Web gagal dimuat. Periksa koneksi internet.');
            try {
                ort.env.wasm.wasmPaths = 'https://cdn.jsdelivr.net/npm/onnxruntime-web@1.20.1/dist/';
                ort.env.wasm.numThreads = 1;
                detectorSession = await ort.InferenceSession.create(DETECTION_MODEL_URL, {
                    executionProviders: ['wasm'],
                    graphOptimizationLevel: 'all'
                });
                console.info('Model deteksi badak dan harimau siap.');
            } catch (error) {
                document.getElementById('target-text').innerText = 'Model belum tersedia. Jalankan training terlebih dahulu.';
                console.error(`Tidak bisa memuat model ${DETECTION_MODEL_URL}:`, error);
                throw error;
            }
        }

        async function analyzeCameraFrame() {
            if (!detectorSession || videoEl.readyState < 2 || isAnalyzingFrame) return;
            isAnalyzingFrame = true;
            try {
                const size = MODEL_INPUT_SIZE;
                canvasEl.width = size; canvasEl.height = size;
                ctx.drawImage(videoEl, 0, 0, size, size);
                const rgba = ctx.getImageData(0, 0, size, size).data;
                const planeSize = size * size, input = new Float32Array(planeSize * 3);
                for (let i = 0; i < planeSize; i++) {
                    input[i] = rgba[i * 4] / 255;
                    input[planeSize + i] = rgba[i * 4 + 1] / 255;
                    input[planeSize * 2 + i] = rgba[i * 4 + 2] / 255;
                }
                const outputs = await detectorSession.run({ [detectorSession.inputNames[0]]: new ort.Tensor('float32', input, [1, 3, size, size]) });
                const output = outputs[detectorSession.outputNames[0]], d = output.data, dims = output.dims;
                const rows = dims.length === 2 && dims[1] === 6 ? dims[0] : dims.length === 3 && dims[0] === 1 && dims[2] === 6 ? dims[1] : 0;
                const found = [];
                for (let i = 0; i < rows; i++) {
                    const base = i * 6, conf = d[base + 4], cls = Math.round(d[base + 5]);
                    if (conf < DETECTION_CONFIDENCE || (cls !== 0 && cls !== 1)) continue;
                    const x1 = d[base], y1 = d[base + 1], x2 = d[base + 2], y2 = d[base + 3];
                    found.push({ cls, conf, cx: (x1+x2)/(2*size), cy: (y1+y2)/(2*size), x1:x1/size, y1:y1/size, x2:x2/size, y2:y2/size });
                }
                // Saring hanya hewan yang berada di tengah layar (area bidikan reticle panah)
                let centerCandidate = null;
                let minCenterDist = Infinity;

                for (const item of found) {
                    const dx = item.cx - 0.5;
                    const dy = item.cy - 0.5;
                    const dist = Math.hypot(dx, dy);

                    // Hanya pertimbangkan jika benar-benar di tengah layar
                    if (Math.abs(dx) <= TARGET_CENTER_TOLERANCE && Math.abs(dy) <= TARGET_CENTER_TOLERANCE) {
                        if (dist < minCenterDist) {
                            minCenterDist = dist;
                            centerCandidate = item;
                        }
                    }
                }

                // Hanya render label untuk hewan di tengah layar (abaikan hewan di samping)
                renderDetectionLabels(centerCandidate ? [centerCandidate] : []);

                // Target misi aktif
                const targetMap = { 'harimau_sumatra': 0, 'badak_sumatra': 1 };
                const targetClassId = targetMap[currentTargetId] ?? (currentFauna && currentFauna.id === 'badak_sumatra' ? 1 : 0);

                // Trigger HANYA jika hewan DI TENGAH cocok dengan target misi!
                // Jika hewan di samping (atau hewan lain di tengah), trigger tidak akan aktif.
                const isTargetInCenter = centerCandidate !== null && centerCandidate.cls === targetClassId;
                consecutiveNoDetect = isTargetInCenter ? 0 : consecutiveNoDetect + 1;
                updateDetectionState(isTargetInCenter, centerCandidate);
            } catch (error) {
                console.error('Inferensi kamera gagal:', error);
                renderDetectionLabels([]); updateDetectionState(false, null);
            } finally { isAnalyzingFrame = false; }
        }

        function renderDetectionLabels(items) {
            // Label persentase melayang dihilangkan agar tampilan kamera bersih
            const layer = document.getElementById('detection-labels');
            if (layer) layer.replaceChildren();
        }
        function updateDetectionState(detectedNow, centerAnimal = null) {
            const animalChanged = (currentCenterAnimal?.cls !== centerAnimal?.cls) || (!currentCenterAnimal !== !centerAnimal);
            const stateChanged = (detectedNow !== isObjectDetected);
            isObjectDetected = detectedNow;
            currentCenterAnimal = centerAnimal;
            if ((stateChanged || animalChanged) && !isPulling && !isFiringAnim) {
                refreshActionState();
            }
        }

        // ===== DETEKSI WARNA (FALLBACK tanpa model ONNX) =====
        // Harimau galaxy punya warna ungu/biru/magenta unik.
        // Kita konversi piksel ke HSV dan hitung berapa banyak piksel
        // yang masuk range warna galaxy di area tengah kamera.

        function rgbToHsv(r, g, b) {
            r /= 255; g /= 255; b /= 255;
            const max = Math.max(r, g, b), min = Math.min(r, g, b);
            const d = max - min;
            let h = 0, s = max === 0 ? 0 : d / max, v = max;
            if (d !== 0) {
                if (max === r) h = ((g - b) / d + 6) % 6;
                else if (max === g) h = (b - r) / d + 2;
                else h = (r - g) / d + 4;
                h *= 60;
            }
            return [h, s, v];
        }

        function isGalaxyColor(r, g, b) {
            const [h, s, v] = rgbToHsv(r, g, b);
            // Rentang warna harimau galaxy:
            // Ungu/violet: H 240-310, S > 0.15, V > 0.12
            // Biru-ungu:   H 210-240, S > 0.2, V > 0.12
            // Magenta:     H 280-340, S > 0.15, V > 0.12
            // Cyan galaxy: H 170-210, S > 0.2, V > 0.15
            if (v < 0.10) return false; // terlalu gelap
            if (s < 0.12) return false; // terlalu abu-abu

            // Ungu/violet/magenta range (H: 210-330)
            if (h >= 200 && h <= 330 && s >= 0.15 && v >= 0.10) return true;
            // Cyan-biru galaxy (H: 170-210)
            if (h >= 160 && h < 200 && s >= 0.20 && v >= 0.15) return true;

            return false;
        }

        function analyzeColorFrame() {
            if (videoEl.readyState < 2 || isAnalyzingFrame) return;
            isAnalyzingFrame = true;

            try {
                const size = COLOR_DETECT_SIZE;
                canvasEl.width = size;
                canvasEl.height = size;
                ctx.drawImage(videoEl, 0, 0, size, size);
                const rgba = ctx.getImageData(0, 0, size, size).data;

                let totalPixels = 0;
                let galaxyPixels = 0;
                let centerGalaxyPixels = 0;
                let centerTotalPixels = 0;

                // Definisi area tengah (40% tengah dari kedua sumbu)
                const centerMargin = 0.3;
                const centerMinX = Math.floor(size * centerMargin);
                const centerMaxX = Math.floor(size * (1 - centerMargin));
                const centerMinY = Math.floor(size * centerMargin);
                const centerMaxY = Math.floor(size * (1 - centerMargin));

                for (let y = 0; y < size; y++) {
                    for (let x = 0; x < size; x++) {
                        const idx = (y * size + x) * 4;
                        const r = rgba[idx], g = rgba[idx + 1], b = rgba[idx + 2];
                        totalPixels++;

                        const isCenter = x >= centerMinX && x <= centerMaxX &&
                                         y >= centerMinY && y <= centerMaxY;
                        if (isCenter) centerTotalPixels++;

                        if (isGalaxyColor(r, g, b)) {
                            galaxyPixels++;
                            if (isCenter) centerGalaxyPixels++;
                        }
                    }
                }

                const globalRatio = galaxyPixels / totalPixels;
                const centerRatio = centerTotalPixels > 0 ? centerGalaxyPixels / centerTotalPixels : 0;

                // Deteksi berhasil jika cukup banyak piksel galaxy, terutama di tengah
                const detectedNow = globalRatio >= COLOR_MIN_RATIO && centerRatio >= COLOR_CENTER_WEIGHT * COLOR_MIN_RATIO;

                if (detectedNow) {
                    consecutiveColorDetect++;
                    // Butuh 2 frame berturut-turut untuk menghindari false positive
                    if (consecutiveColorDetect >= 2) {
                        updateDetectionState(true);
                    }
                } else {
                    consecutiveColorDetect = 0;
                    updateDetectionState(false);
                }

            } catch (error) {
                console.error('Analisis warna gagal:', error);
                updateDetectionState(false);
            } finally {
                isAnalyzingFrame = false;
            }
        }

        function loadCredentials() {
            const savedUrl = localStorage.getItem('xr_supabase_url') || DEFAULT_URL;
            const savedKey = localStorage.getItem('xr_supabase_key') || DEFAULT_KEY;
            const savedTarget = localStorage.getItem('xr_target_id') || DEFAULT_TARGET;

            document.getElementById('input-url').value = savedUrl;
            document.getElementById('input-key').value = savedKey;
            document.getElementById('input-target').value = savedTarget;

            currentTargetId = savedTarget;
            db = window.supabase.createClient(savedUrl, savedKey);
            startAutoSync();
        }

        function saveCredentials() {
            const urlVal = document.getElementById('input-url').value.trim().replace(/\/$/, '');
            const keyVal = document.getElementById('input-key').value.trim();
            const targetVal = document.getElementById('input-target').value.trim() || DEFAULT_TARGET;

            if (!urlVal.startsWith('https://')) {
                alert('Masukkan Supabase Project URL yang valid (diawali https://)');
                return;
            }

            localStorage.setItem('xr_supabase_url', urlVal);
            localStorage.setItem('xr_supabase_key', keyVal);
            localStorage.setItem('xr_target_id', targetVal);
            location.reload();
        }

        function startAutoSync() {
            fetchLatestState();
            setInterval(() => {
                if (!isCatchingNow && !isPulling && !isFiringAnim) fetchLatestState();
            }, 800);

            db.channel('fauna-updates')
                .on('postgres_changes', {
                    event: 'UPDATE',
                    schema: 'public',
                    table: 'fauna_state'
                }, payload => {
                    if (payload.new.id === currentTargetId && !isCatchingNow && !isFiringAnim) {
                        handleDatabaseUpdate(payload.new, false);
                    }
                })
                .subscribe();
        }

        async function fetchLatestState() {
            const {
                data,
                error
            } = await db
                .from('fauna_state')
                .select('*')
                .eq('id', currentTargetId)
                .single();

            if (error) {
                document.getElementById('status-badge').innerText = 'Koneksi Gagal';
                return;
            }

            if (data) {
                handleDatabaseUpdate(data, false);
            }
        }

        function handleDatabaseUpdate(fauna, fromLocalCatch) {
            const wasCaught = currentFauna ? currentFauna.is_caught : null;
            currentFauna = fauna;

            if (fauna.is_caught) {
                addToCollection(fauna);
                if (!isFiringAnim) {
                    refreshActionState();
                }
                if (!fromLocalCatch && wasCaught === false && !isFiringAnim) {
                    arrowGroup.style.setProperty('--release-y', '16px');
                    playBowReleaseAndOrbAnimation();
                }
            } else {
                removeFromCollection(fauna.id);
                if (!isFiringAnim) {
                    refreshActionState();
                }
            }
        }

        function refreshActionState() {
            const pillCatch = document.getElementById('pill-catch');
            const pillCaught = document.getElementById('pill-caught');
            const badge = document.getElementById('status-badge');
            const targetText = document.getElementById('target-text');

            if (!currentFauna) return;

            targetText.classList.remove('fire-ready');

            // 1. Nama hewan di tengah atas menyesuaikan hewan yang ada di tengah layar (statis di UI, tanpa emot)
            if (currentCenterAnimal) {
                const centerName = currentCenterAnimal.cls === 0 ? 'Harimau Sumatra' : 'Badak Sumatra';
                badge.innerText = centerName;
                badge.style.background = isObjectDetected ? 'rgba(16, 185, 129, 0.45)' : 'rgba(239, 68, 68, 0.45)';
                badge.style.borderColor = isObjectDetected ? 'rgba(52, 211, 153, 0.85)' : 'rgba(248, 113, 113, 0.85)';
                badge.style.color = '#fff';
            } else {
                badge.innerText = currentFauna.island || 'Sumatra';
                badge.style.background = 'rgba(0, 0, 0, 0.35)';
                badge.style.borderColor = 'rgba(255, 255, 255, 0.18)';
                badge.style.color = 'rgba(255, 255, 255, 0.85)';
            }

            if (currentFauna.is_caught) {
                pillCaught.classList.add('active-caught');
            } else {
                pillCaught.classList.remove('active-caught');
            }

            // 2. Logika busur panah & teks instruksi
            if (isObjectDetected) {
                // Hewan di tengah adalah target misi yang tepat
                bowStage.classList.add('detected');
                pillCatch.classList.add('active-ready');
                targetText.innerText = `Tarik panah ke bawah untuk menangkap ${currentFauna.name}!`;
            } else if (currentCenterAnimal) {
                // Ada hewan di tengah tetapi BUKAN target yang dicari
                const centerName = currentCenterAnimal.cls === 0 ? 'Harimau Sumatra' : 'Badak Sumatra';
                bowStage.classList.remove('detected');
                pillCatch.classList.remove('active-ready');
                targetText.innerText = `Bukan target! Ini ${centerName} (Target: ${currentFauna.name})`;
            } else {
                // Tidak ada hewan di tengah (kosong atau hanya di samping layar)
                bowStage.classList.remove('detected');
                pillCatch.classList.remove('active-ready');
                targetText.innerText = `Arahkan panah ke ${currentFauna.name}`;
            }
        }

        function playBowReleaseAndOrbAnimation() {
            if (isFiringAnim) return;
            isFiringAnim = true;

            const flash = document.getElementById('capture-flash');
            const orb = document.getElementById('captured-orb');
            const pillCaught = document.getElementById('pill-caught');
            const centerPill = document.getElementById('center-pill');
            const colBtn = document.getElementById('btn-col');

            flash.classList.remove('flash-active');
            bowStage.classList.remove('firing', 'arrow-hidden');
            void flash.offsetWidth;

            // Tahap 1: Anak panah berubah terang bercahaya dan menghilang perlahan
            flash.classList.add('flash-active');
            bowStage.classList.add('firing');

            if (navigator.vibrate) navigator.vibrate([85, 45, 160]);

            const startRect = bowStage.getBoundingClientRect();
            const endRect = pillCaught.getBoundingClientRect();

            const startX = startRect.left + startRect.width / 2;
            const startY = startRect.top + startRect.height * 0.28;
            const endX = endRect.left + endRect.width / 2;
            const endY = endRect.top + endRect.height / 2;

            setTimeout(() => {
                bowStage.classList.add('arrow-hidden');
                bowStage.classList.remove('firing');
                arrowGroup.style.transform = 'translateY(0px)';
            }, 900);

            // Tahap 2: Munculkan bola cahaya putih & tahan sejenak di tengah
            setTimeout(() => {
                orb.style.transition = 'none';
                orb.style.left = startX + 'px';
                orb.style.top = startY + 'px';
                orb.style.transform = 'translate(-50%, -50%) scale(0.15)';
                orb.style.opacity = '0';

                requestAnimationFrame(() => {
                    orb.style.transition = 'transform 0.5s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.4s ease';
                    orb.style.transform = 'translate(-50%, -50%) scale(1.18)';
                    orb.style.opacity = '1';

                    // Tahap 3: Luncurkan bola cahaya perlahan ke bilah bawah
                    setTimeout(() => {
                        orb.style.transition = 'left 1.45s cubic-bezier(0.25, 0.85, 0.3, 1), top 1.45s cubic-bezier(0.25, 0.85, 0.3, 1), transform 1.45s ease-in-out, opacity 1.45s ease-in';
                        orb.style.left = endX + 'px';
                        orb.style.top = endY + 'px';
                        orb.style.transform = 'translate(-50%, -50%) scale(0.18)';
                        orb.style.opacity = '0.25';

                        // Tahap 4: Bola cahaya terserap ke inventory/Tertangkap, perbarui hitungan, lalu munculkan panah kembali
                        setTimeout(() => {
                            orb.style.opacity = '0';
                            isFiringAnim = false;

                            centerPill.classList.remove('absorb-glow');
                            void centerPill.offsetWidth;
                            centerPill.classList.add('absorb-glow');

                            colBtn.classList.add('bump');
                            setTimeout(() => colBtn.classList.remove('bump'), 550);

                            renderCollection();
                            refreshActionState();

                            bowStage.classList.remove('arrow-hidden');
                        }, 1450);
                    }, 560);
                });
            }, 420);
        }

        async function catchFauna() {
            if (!db || isCatchingNow || !isObjectDetected) return;

            isCatchingNow = true;

            const {
                data,
                error
            } = await db
                .from('fauna_state')
                .update({
                    is_caught: true,
                    caught_at: new Date().toISOString()
                })
                .eq('id', currentTargetId)
                .select()
                .single();

            isCatchingNow = false;

            if (error) {
                alert('Gagal menangkap: ' + error.message);
            } else if (data) {
                handleDatabaseUpdate(data, true);
            }
        }

        function addToCollection(fauna) {
            if (!myCollection.some(item => item.id === fauna.id)) {
                myCollection.push(fauna);
                if (!isFiringAnim) renderCollection();
            }
        }

        function removeFromCollection(id) {
            const prevLen = myCollection.length;
            myCollection = myCollection.filter(item => item.id !== id);
            if (myCollection.length !== prevLen && !isFiringAnim) renderCollection();
        }

        function renderCollection() {
            document.getElementById('count-label').innerText = `${myCollection.length}/1`;
            const listEl = document.getElementById('collection-list');
            if (myCollection.length === 0) {
                listEl.innerHTML = '<p style="color: #94a3b8; font-size: 13px;">Belum ada fauna yang tertangkap.</p>';
                return;
            }
            listEl.innerHTML = myCollection.map(item => `
        <div class="card-item">
          <h3>${item.name}</h3>
          <p>Asal Wilayah: Pulau ${item.island}</p>
        </div>
      `).join('');
        }

        function showHint(customMessage) {
            const toast = document.getElementById('hint-toast');
            toast.innerText = customMessage || DEFAULT_HINT_MSG;
            toast.classList.add('show');
            clearTimeout(hintTimeout);
            hintTimeout = setTimeout(() => {
                toast.classList.remove('show');
            }, 3200);
        }

        // Fitur Full Screen (Layar Penuh)
        function toggleFullScreen() {
            const doc = window.document;
            const docEl = doc.documentElement;

            const requestFullScreen = docEl.requestFullscreen || docEl.mozRequestFullScreen || docEl.webkitRequestFullScreen || docEl.msRequestFullscreen;
            const cancelFullScreen = doc.exitFullscreen || doc.mozCancelFullScreen || doc.webkitExitFullscreen || doc.msExitFullscreen;
            const isFullScreen = doc.fullscreenElement || doc.mozFullScreenElement || doc.webkitFullscreenElement || doc.msFullscreenElement;

            if (!isFullScreen) {
                if (requestFullScreen) {
                    const promise = requestFullScreen.call(docEl);
                    if (promise && typeof promise.catch === 'function') {
                        promise.catch(() => {
                            showHint('Browser membatasi layar penuh otomatis. Pilih "Tambah ke Layar Utama" di menu browser untuk mode penuh.');
                        });
                    }
                } else {
                    showHint('Pilih "Tambah ke Layar Utama" di menu browser Safari untuk mode layar penuh.');
                }
            } else {
                if (cancelFullScreen) {
                    cancelFullScreen.call(doc);
                }
            }
        }

        function updateFullscreenIcon() {
            const isFullScreen = document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement || document.msFullscreenElement;
            const enterIcon = document.getElementById('icon-fs-enter');
            const exitIcon = document.getElementById('icon-fs-exit');
            if (enterIcon && exitIcon) {
                enterIcon.style.display = isFullScreen ? 'none' : 'block';
                exitIcon.style.display = isFullScreen ? 'block' : 'none';
            }
        }

        document.addEventListener('fullscreenchange', updateFullscreenIcon);
        document.addEventListener('webkitfullscreenchange', updateFullscreenIcon);

        function toggleSettings(show) {
            document.getElementById('settings-modal').style.display = show ? 'flex' : 'none';
        }

        function toggleCollection(show) {
            document.getElementById('inventory-modal').style.display = show ? 'flex' : 'none';
        }

        startCamera();
        loadCredentials();
    </script>
</body>
