<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>XR Budaya Indonesia - Catch Scanner</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', sans-serif;
        }
        
        body {
            background: #000;
            color: #fff;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }
        
        #camera-feed {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
        }
        
        #capture-flash {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle, rgba(251, 191, 36, 0.85) 0%, rgba(255, 255, 255, 0.95) 100%);
            z-index: 5;
            opacity: 0;
            pointer-events: none;
        }
        
        .flash-active {
            animation: flashAnim 0.65s ease-out forwards;
        }
        
        @keyframes flashAnim {
            0% {
                opacity: 0.95;
            }
            100% {
                opacity: 0;
            }
        }
        
        .ui-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            pointer-events: none;
        }
        
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            pointer-events: auto;
        }
        
        .top-left {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .badge {
            background: rgba(15, 23, 42, 0.78);
            backdrop-filter: blur(8px);
            padding: 8px 12px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            font-size: 12px;
            font-weight: 600;
        }
        
        .btn-settings {
            background: rgba(30, 41, 59, 0.85);
            color: #f8fafc;
            border: 1px solid rgba(255, 255, 255, 0.25);
            padding: 8px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
        }
        
        .btn-collection {
            background: #f59e0b;
            color: #000;
            border: none;
            padding: 8px 14px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 12px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        
        .btn-collection.bump {
            animation: bumpScale 0.4s ease;
        }
        
        @keyframes bumpScale {
            0% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.25);
            }
            100% {
                transform: scale(1);
            }
        }
        /* Bidikan Tengah & Status Deteksi */
        
        .scanner-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        
        .reticle {
            width: 210px;
            height: 210px;
            border: 3px dashed rgba(255, 255, 255, 0.45);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.25s ease;
        }
        
        .reticle-inner {
            width: 12px;
            height: 12px;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            transition: all 0.25s ease;
        }
        /* Saat objek terdeteksi di kamera */
        
        .reticle.detected {
            border: 4px solid #10b981;
            box-shadow: 0 0 35px rgba(16, 185, 129, 0.75), inset 0 0 20px rgba(16, 185, 129, 0.25);
            transform: scale(1.06);
        }
        
        .reticle.detected .reticle-inner {
            background: #10b981;
            transform: scale(1.4);
        }
        /* Animasi saat tombol tangkap ditekan */
        
        .reticle.catching {
            animation: spinCatch 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
            border-style: solid;
            border-color: #fbbf24;
            box-shadow: 0 0 50px rgba(251, 191, 36, 0.9);
        }
        
        @keyframes spinCatch {
            0% {
                transform: scale(1.1) rotate(0deg);
            }
            60% {
                transform: scale(0.35) rotate(240deg);
            }
            100% {
                transform: scale(1) rotate(360deg);
            }
        }
        
        .target-label {
            margin-top: 16px;
            background: rgba(0, 0, 0, 0.75);
            padding: 8px 16px;
            border-radius: 14px;
            font-size: 13px;
            color: #e2e8f0;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.25s ease;
        }
        
        .target-label.detected {
            color: #6ee7b7;
            border-color: #10b981;
            background: rgba(6, 78, 59, 0.85);
            font-weight: 600;
        }
        /* Banner Notifikasi Berhasil Tertangkap */
        
        #catch-banner {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.5);
            background: linear-gradient(135deg, #065f46 0%, #0f172a 100%);
            border: 2px solid #34d399;
            border-radius: 20px;
            padding: 22px 28px;
            text-align: center;
            z-index: 6;
            opacity: 0;
            pointer-events: none;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.85);
            transition: all 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            width: 82%;
            max-width: 320px;
        }
        
        #catch-banner.show {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }
        
        #catch-banner .check-icon {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: #10b981;
            color: #000;
            font-size: 26px;
            font-weight: 900;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 10px auto;
        }
        
        #catch-banner h3 {
            color: #34d399;
            font-size: 16px;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }
        
        #catch-banner p {
            color: #f8fafc;
            font-size: 14px;
            font-weight: 600;
        }
        /* Tombol Tangkap Bawah */
        
        .bottom-bar {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            pointer-events: auto;
            margin-bottom: 15px;
        }
        
        #catch-btn {
            width: 88px;
            height: 88px;
            border-radius: 50%;
            background: radial-gradient(circle, #fbbf24 0%, #d97706 100%);
            border: 5px solid #fff;
            color: #000;
            font-weight: 800;
            font-size: 11px;
            box-shadow: 0 0 25px rgba(245, 158, 11, 0.85);
            cursor: pointer;
            transition: transform 0.15s, background 0.25s;
            line-height: 1.2;
            padding: 4px;
        }
        
        #catch-btn:active {
            transform: scale(0.9);
        }
        
        #catch-btn:disabled {
            background: rgba(30, 41, 59, 0.85);
            border-color: #475569;
            color: #94a3b8;
            box-shadow: none;
            cursor: not-allowed;
        }
        /* Modal Umum */
        
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(9, 13, 22, 0.94);
            z-index: 10;
            display: none;
            flex-direction: column;
            padding: 24px;
            overflow-y: auto;
        }
        
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid #334155;
            padding-bottom: 12px;
        }
        
        .card-item {
            background: #1e293b;
            border: 1px solid #f59e0b;
            border-radius: 14px;
            padding: 16px;
            margin-bottom: 12px;
        }
        
        .card-item h3 {
            color: #fbbf24;
            margin-bottom: 4px;
        }
        
        .card-item p {
            font-size: 13px;
            color: #cbd5e1;
        }
        
        .form-group {
            margin-bottom: 16px;
        }
        
        .form-group label {
            display: block;
            font-size: 13px;
            color: #cbd5e1;
            margin-bottom: 6px;
            font-weight: 600;
        }
        
        .form-group input {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid #475569;
            background: #1e293b;
            color: #fff;
            font-size: 14px;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: #f59e0b;
        }
        
        .btn-save {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: none;
            background: #10b981;
            color: #000;
            font-weight: 800;
            font-size: 15px;
            cursor: pointer;
            margin-top: 8px;
        }
        
        .hint-text {
            font-size: 12px;
            color: #94a3b8;
            margin-top: 12px;
            line-height: 1.5;
        }
    </style>
</head>

<body>

    <video id="camera-feed" autoplay playsinline></video>
    <!-- Canvas tersembunyi untuk analisis computer vision kamera -->
    <canvas id="vision-canvas" width="80" height="80" style="display:none;"></canvas>
    <div id="capture-flash"></div>

    <!-- Notifikasi Berhasil Menangkap -->
    <div id="catch-banner">
        <div class="check-icon">&#10003;</div>
        <h3>BERHASIL DITANGKAP!</h3>
        <p id="banner-fauna-name">Harimau Sumatera</p>
    </div>

    <div class="ui-layer">
        <div class="top-bar">
            <div class="top-left">
                <button class="btn-settings" onclick="toggleSettings(true)">Kredensial</button>
                <div class="badge" id="status-badge">Menghubungkan...</div>
            </div>
            <button class="btn-collection" id="btn-col" onclick="toggleCollection(true)">Koleksi (<span id="count">0</span>)</button>
        </div>

        <div class="scanner-container">
            <div class="reticle" id="reticle">
                <div class="reticle-inner"></div>
            </div>
            <div class="target-label" id="target-text">Memuat sistem...</div>
        </div>

        <div class="bottom-bar">
            <button id="catch-btn" onclick="catchFauna()" disabled>CARI OBJEK</button>
        </div>
    </div>

    <!-- Modal Pengaturan Kredensial Supabase -->
    <div id="settings-modal" class="modal-overlay">
        <div class="modal-header">
            <h2>Kredensial Supabase</h2>
            <button class="btn-settings" onclick="toggleSettings(false)">Tutup</button>
        </div>
        <div class="form-group">
            <label for="input-url">Supabase Project URL</label>
            <input type="url" id="input-url" placeholder="https://lkyunvagzbodtmvbdfdm.supabase.co" />
        </div>
        <div class="form-group">
            <label for="input-key">Publishable API Key</label>
            <input type="text" id="input-key" placeholder="sb_publishable_..." />
        </div>
        <div class="form-group">
            <label for="input-target">Target ID Fauna (Database)</label>
            <input type="text" id="input-target" placeholder="harimau_sumatra" />
        </div>
        <button class="btn-save" onclick="saveCredentials()">Simpan & Hubungkan</button>
        <p class="hint-text">Kredensial tersimpan otomatis di browser perangkat ini.</p>
    </div>

    <!-- Modal Laci Koleksi HP -->
    <div id="inventory-modal" class="modal-overlay">
        <div class="modal-header">
            <h2>Koleksi Fauna Nusantara</h2>
            <button class="btn-collection" onclick="toggleCollection(false)">Tutup</button>
        </div>
        <div id="collection-list">
            <p style="color: #94a3b8;">Belum ada fauna yang tertangkap.</p>
        </div>
    </div>

    <script>
        const DEFAULT_URL = 'https://lkyunvagzbodtmvbdfdm.supabase.co';
        const DEFAULT_KEY = 'sb_publishable_CRMI4bAg4seaGDWpY-CfEw_pqKDzO1z';
        const DEFAULT_TARGET = 'harimau_sumatra';

        let db = null;
        let myCollection = [];
        let currentTargetId = localStorage.getItem('xr_target_id') || DEFAULT_TARGET;
        let currentFauna = null;
        let isObjectDetected = false;
        let isCatchingNow = false;

        const videoEl = document.getElementById('camera-feed');
        const canvasEl = document.getElementById('vision-canvas');
        const ctx = canvasEl.getContext('2d', {
            willReadFrequently: true
        });

        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        facingMode: 'environment'
                    },
                    audio: false
                });
                videoEl.srcObject = stream;
                videoEl.onloadedmetadata = () => {
                    setInterval(analyzeCameraFrame, 150);
                };
            } catch (err) {
                alert('Gagal membuka kamera. Pastikan halaman dibuka melalui HTTPS.');
            }
        }

        // Analisis Computer Vision pada area tengah reticle
        function analyzeCameraFrame() {
            if (videoEl.readyState < 2) return;

            const vw = videoEl.videoWidth;
            const vh = videoEl.videoHeight;
            const cropSize = Math.min(vw, vh) * 0.35;
            const sx = (vw - cropSize) / 2;
            const sy = (vh - cropSize) / 2;

            ctx.drawImage(videoEl, sx, sy, cropSize, cropSize, 0, 0, 80, 80);
            const pixels = ctx.getImageData(0, 0, 80, 80).data;

            let matchedPixels = 0;
            const totalPixels = 80 * 80;

            for (let i = 0; i < pixels.length; i += 4) {
                const r = pixels[i] / 255;
                const g = pixels[i + 1] / 255;
                const b = pixels[i + 2] / 255;

                const max = Math.max(r, g, b);
                const min = Math.min(r, g, b);
                const d = max - min;
                const s = max === 0 ? 0 : d / max;
                const v = max;

                let h = 0;
                if (d !== 0) {
                    if (max === r) h = ((g - b) / d + (g < b ? 6 : 0)) * 60;
                    else if (max === g) h = ((b - r) / d + 2) * 60;
                    else h = ((r - g) / d + 4) * 60;
                }

                // Deteksi warna Oranye Terang kubus target dari layar Unity (Hue 8°–44°, Saturasi & Kecerahan cukup)
                if (h >= 8 && h <= 44 && s >= 0.42 && v >= 0.35) {
                    matchedPixels++;
                }
            }

            const matchRatio = matchedPixels / totalPixels;
            const detectedNow = matchRatio >= 0.18; // Minimal 18% area lingkaran berisi objek

            if (detectedNow !== isObjectDetected) {
                isObjectDetected = detectedNow;
                refreshActionState();
            }
        }

        function loadCredentials() {
            const savedUrl = localStorage.getItem('xr_supabase_url') || DEFAULT_URL;
            const savedKey = localStorage.getItem('xr_supabase_key') || DEFAULT_KEY;
            const savedTarget = localStorage.getItem('xr_target_id') || DEFAULT_TARGET;

            document.getElementById('input-url').value = savedUrl;
            document.getElementById('input-key').value = savedKey;
            document.getElementById('input-target').value = savedTarget;

            currentTargetId = savedTarget;
            db = window.supabase.createClient(savedUrl, savedKey);
            startAutoSync();
        }

        function saveCredentials() {
            const urlVal = document.getElementById('input-url').value.trim().replace(/\/$/, '');
            const keyVal = document.getElementById('input-key').value.trim();
            const targetVal = document.getElementById('input-target').value.trim() || DEFAULT_TARGET;

            if (!urlVal.startsWith('https://')) {
                alert('Masukkan Supabase Project URL yang valid (diawali https://)');
                return;
            }

            localStorage.setItem('xr_supabase_url', urlVal);
            localStorage.setItem('xr_supabase_key', keyVal);
            localStorage.setItem('xr_target_id', targetVal);
            location.reload();
        }

        function startAutoSync() {
            fetchLatestState();
            setInterval(() => {
                if (!isCatchingNow) fetchLatestState();
            }, 800);

            db.channel('fauna-updates')
                .on('postgres_changes', {
                    event: 'UPDATE',
                    schema: 'public',
                    table: 'fauna_state'
                }, payload => {
                    if (payload.new.id === currentTargetId && !isCatchingNow) {
                        handleDatabaseUpdate(payload.new, false);
                    }
                })
                .subscribe();
        }

        async function fetchLatestState() {
            const {
                data,
                error
            } = await db
                .from('fauna_state')
                .select('*')
                .eq('id', currentTargetId)
                .single();

            if (error) {
                document.getElementById('status-badge').innerText = 'Koneksi Gagal';
                document.getElementById('target-text').innerText = 'Cek Kredensial / Database';
                return;
            }

            if (data) {
                handleDatabaseUpdate(data, false);
            }
        }

        function handleDatabaseUpdate(fauna, justCaughtByUser) {
            const wasCaught = currentFauna ? currentFauna.is_caught : null;
            currentFauna = fauna;

            if (fauna.is_caught) {
                addToCollection(fauna);
                if (justCaughtByUser || wasCaught === false) {
                    playCatchAnimation(fauna.name);
                }
            } else {
                removeFromCollection(fauna.id);
            }

            refreshActionState();
        }

        // Mengatur tampilan Reticle & Tombol berdasarkan deteksi kamera + status database
        function refreshActionState() {
            const btn = document.getElementById('catch-btn');
            const badge = document.getElementById('status-badge');
            const targetText = document.getElementById('target-text');
            const reticle = document.getElementById('reticle');

            if (!currentFauna) return;

            if (currentFauna.is_caught) {
                btn.disabled = true;
                btn.innerText = 'TERTANGKAP';
                badge.innerText = 'Sudah Ditangkap';
                targetText.classList.remove('detected');
                reticle.classList.remove('detected');
                targetText.innerText = `${currentFauna.name} sudah tertangkap!`;
                return;
            }

            badge.innerText = 'Aktif: ' + currentFauna.island;

            if (isObjectDetected) {
                // Objek terlihat di kamera -> Buka kunci tombol tangkap
                btn.disabled = false;
                btn.innerText = 'TANGKAP';
                reticle.classList.add('detected');
                targetText.classList.add('detected');
                targetText.innerText = `Terdeteksi: ${currentFauna.name}!`;
            } else {
                // Objek tidak ada di kamera -> Kunci tombol tangkap
                btn.disabled = true;
                btn.innerText = 'CARI OBJEK';
                reticle.classList.remove('detected');
                targetText.classList.remove('detected');
                targetText.innerText = `Arahkan kamera ke kotak oranye (${currentFauna.name})`;
            }
        }

        function playCatchAnimation(faunaName) {
            const reticle = document.getElementById('reticle');
            const flash = document.getElementById('capture-flash');
            const banner = document.getElementById('catch-banner');
            const colBtn = document.getElementById('btn-col');

            document.getElementById('banner-fauna-name').innerText = `${faunaName} masuk ke koleksimu!`;

            reticle.classList.remove('catching');
            flash.classList.remove('flash-active');
            void reticle.offsetWidth;
            reticle.classList.add('catching');
            flash.classList.add('flash-active');

            banner.classList.add('show');
            colBtn.classList.add('bump');

            if (navigator.vibrate) navigator.vibrate([120, 60, 220]);

            setTimeout(() => {
                reticle.classList.remove('catching');
                colBtn.classList.remove('bump');
            }, 700);

            setTimeout(() => {
                banner.classList.remove('show');
            }, 2400);
        }

        async function catchFauna() {
            if (!db || isCatchingNow || !isObjectDetected) return;
            isCatchingNow = true;

            const btn = document.getElementById('catch-btn');
            btn.disabled = true;
            btn.innerText = '...';

            const {
                data,
                error
            } = await db
                .from('fauna_state')
                .update({
                    is_caught: true,
                    caught_at: new Date().toISOString()
                })
                .eq('id', currentTargetId)
                .select()
                .single();

            isCatchingNow = false;

            if (error) {
                alert('Gagal menangkap: ' + error.message);
                refreshActionState();
            } else if (data) {
                handleDatabaseUpdate(data, true);
            }
        }

        function addToCollection(fauna) {
            if (!myCollection.some(item => item.id === fauna.id)) {
                myCollection.push(fauna);
                renderCollection();
            }
        }

        function removeFromCollection(id) {
            const prevLen = myCollection.length;
            myCollection = myCollection.filter(item => item.id !== id);
            if (myCollection.length !== prevLen) renderCollection();
        }

        function renderCollection() {
            document.getElementById('count').innerText = myCollection.length;
            const listEl = document.getElementById('collection-list');
            if (myCollection.length === 0) {
                listEl.innerHTML = '<p style="color: #94a3b8;">Belum ada fauna yang tertangkap.</p>';
                return;
            }
            listEl.innerHTML = myCollection.map(item => `
        <div class="card-item">
          <h3>${item.name}</h3>
          <p>Asal Wilayah: Pulau ${item.island}</p>
        </div>
      `).join('');
        }

        function toggleSettings(show) {
            document.getElementById('settings-modal').style.display = show ? 'flex' : 'none';
        }

        function toggleCollection(show) {
            document.getElementById('inventory-modal').style.display = show ? 'flex' : 'none';
        }

        startCamera();
        loadCredentials();
    </script>
</body>

</html>
